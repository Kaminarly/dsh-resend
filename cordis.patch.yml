# dsh-resend — profile bundle patch layer.
#
# Mounts the plugin as one normal Cordis row in the target profile (the
# package's `main` → lib/index.js Host half runs as that row). The package's
# `dsh.client` metadata is scanned by the client-modules node half, and its
# client half (exports["./client"] → lib/client.bundle.js, a self-registering
# window.__ModuleLoader__ entry) is served to the Web client automatically
# while this row is enabled.
#
# Install into any profile with:
#   dsh plugin --profile <name> add dsh-resend
# Restart DSH Desktop / the dsh process after installing or removing.

- insert:
    - id: dsh-resend
      name: dsh-resend
